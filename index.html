<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blue Moon Factory — ZIP images principales</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:35px auto;padding:0 18px;background:#f3f7fc;color:#172033}
.card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 8px 30px #0001}
button{font-size:16px;padding:13px 18px;border:0;border-radius:12px;background:#a8cbed;color:#10223b;font-weight:700;cursor:pointer;margin:5px}
button:disabled{opacity:.45}.status{margin:18px 0;font-weight:650}
progress{width:100%;height:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:18px}
.item{font-size:11px;background:#f7f9fc;padding:7px;border-radius:10px}.item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}
.note{font-size:13px;color:#667085}
</style></head>
<body><div class="card">
<h1>Blue Moon Factory</h1>
<p>Une seule image principale par produit → un seul fichier ZIP.</p>
<button id="load">1 — Charger le catalogue</button>
<button id="zip" disabled>2 — Créer et télécharger le ZIP</button>
<div id="status" class="status">Prêt.</div>
<progress id="prog" value="0" max="100" style="display:none"></progress>
<p class="note">Laisse cette page ouverte pendant la création du ZIP. Selon la connexion, cela peut prendre quelques minutes.</p>
<div id="grid" class="grid"></div>
</div>
<script>
let products=[];
const status=document.getElementById('status'), prog=document.getElementById('prog');
const endpoints=[
 'https://bluemoonfactory.com/collections/all/products.json?limit=250',
 'https://bluemoonfactory.com/products.json?limit=250'
];
function clean(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[<>:"/\\|?*\x00-\x1F]/g,'-').replace(/\s+/g,' ').trim().slice(0,130)}
function extension(url,type){let m=url.split('?')[0].match(/\.([a-zA-Z0-9]{2,5})$/);if(m)return '.'+m[1].toLowerCase(); if(type&&type.includes('png'))return '.png';if(type&&type.includes('webp'))return '.webp';return '.jpg'}
async function fetchCatalog(){
 status.textContent='Chargement du catalogue…'; products=[];
 let lastErr;
 for(const ep of endpoints){
  try{
   const r=await fetch(ep,{mode:'cors'}); if(!r.ok)throw new Error('HTTP '+r.status);
   const d=await r.json(); products=(d.products||[]).filter(p=>p.images&&p.images.length); if(products.length)break;
  }catch(e){lastErr=e}
 }
 if(!products.length){status.textContent='Le catalogue n’a pas pu être chargé : '+lastErr;return}
 status.textContent=products.length+' produits trouvés. Vérifie les miniatures puis crée le ZIP.';
 document.getElementById('zip').disabled=false;
 const g=document.getElementById('grid');g.innerHTML='';
 products.forEach((p,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML='<img loading="lazy" src="'+p.images[0].src.replace(/"/g,'&quot;')+'"><div>'+(i+1)+'. '+p.title.replace(/</g,'&lt;')+'</div>';g.appendChild(d)})
}
async function makeZip(){
 if(typeof JSZip==='undefined'){status.textContent='JSZip n’a pas pu être chargé. Vérifie la connexion Internet puis recharge la page.';return}
 document.getElementById('zip').disabled=true; document.getElementById('load').disabled=true;
 prog.style.display='block';prog.max=products.length;prog.value=0;
 const zip=new JSZip(); const folder=zip.folder('Blue Moon Factory - Images principales');
 let ok=0,fail=[];
 for(let i=0;i<products.length;i++){
  const p=products[i],url=p.images[0].src;
  status.textContent=`Récupération ${i+1}/${products.length} : ${p.title}`;
  try{
   const r=await fetch(url,{mode:'cors'});if(!r.ok)throw new Error('HTTP '+r.status);
   const b=await r.blob();
   folder.file(String(i+1).padStart(3,'0')+' - '+clean(p.title)+extension(url,b.type),b);ok++;
  }catch(e){fail.push(p.title)}
  prog.value=i+1;
 }
 status.textContent=`Compression de ${ok} images…`;
 const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},m=>{
   status.textContent=`Création du ZIP : ${Math.round(m.percent)} %`;
 });
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BlueMoonFactory_Images_Principales.zip';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
 status.textContent=`Terminé : ${ok} images dans le ZIP`+(fail.length?` — ${fail.length} image(s) non récupérée(s).`:' — aucune erreur.');
 document.getElementById('zip').disabled=false;document.getElementById('load').disabled=false;
}
document.getElementById('load').onclick=fetchCatalog;document.getElementById('zip').onclick=makeZip;
</script></body></html>
